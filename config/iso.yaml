label: "CUBELINUX-ANACONDA-GTK-SMOKE"
grub2:
  timeout: 5
  entries:
    - name: "Diagnostic shell (GTK test; mount log disk first)"
      linux: "${kernelpath} ${root} systemd.unit=multi-user.target inst.graphical inst.nokill console=tty0 selinux=0"
      initrd: "${initrdpath}"
    - name: "Anaconda GTK smoke test (no OS image)"
      linux: "${kernelpath} ${root} inst.graphical inst.nokill console=tty0 selinux=0 rhgb quiet"
      initrd: "${initrdpath}"
