efi:
  mountPoint: /boot/efi
  recommendedSize: 600MiB
  minimumSize: 32MiB
  label: EFI

userSwapChoices:
  - none
initialSwapChoice: none
initialPartitioningChoice: erase
defaultPartitionTableType: gpt
requiredPartitionTableType: gpt
defaultFileSystemType: ext4
availableFileSystemTypes:
  - ext4
allowManualPartitioning: false
# The recovery reset currently supports direct ext4 roots. Do not offer a
# root encryption option that the reset flow cannot preserve.
enableLuksAutomatedPartitioning: false
lvm:
  enable: false

# Keep the recovery environment separate from the resettable root filesystem.
# The EFI partition is created by Calamares before this layout.
requiredStorage: 73
partitionLayout:
  - name: CUBE_RECOVERY
    filesystem: ext4
    noEncrypt: true
    size: 32G
  - name: CUBE_ROOT
    filesystem: ext4
    mountPoint: /
    size: 100%
    minSize: 40G
