modules-search: [ local ]

instances:
  - id: bootc-install
    module: shellprocess
    config: shellprocess-bootc-install.conf
  - id: machineid-bootc
    module: shellprocess
    config: shellprocess-machineid.conf
  - id: cleanup-fstab
    module: shellprocess
    config: shellprocess-cleanup-fstab.conf
  - id: finalize-bootc
    module: shellprocess
    config: shellprocess-finalize-bootc.conf

sequence:
  - show:
      - welcome
      - partition
      - summary
  - exec:
      - partition
      - mount
      - shellprocess@bootc-install
      - shellprocess@machineid-bootc
      - fstab
      - shellprocess@cleanup-fstab
      - shellprocess@finalize-bootc
      - umount
  - show:
      - finished

branding: cubelinux
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: true
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
