modules-search: [ /usr/share/cubelinux-installer/calamares-modules, local ]

instances:
  - id: recovery-boot
    module: shellprocess
    config: shellprocess-recovery-boot.conf
  - id: stage-recovery
    module: shellprocess
    config: shellprocess-stage-recovery.conf
  - id: bootc-install
    module: shellprocess
    config: shellprocess-bootc-install.conf
  - id: cleanup-fstab
    module: shellprocess
    config: shellprocess-cleanup-fstab.conf
  - id: finalize-bootc
    module: shellprocess
    config: shellprocess-finalize-bootc.conf

sequence:
  - show:
      - welcome
      - partition
      - summary
  - exec:
      - cubelinux-erase-only
      - partition
      - mount
      - shellprocess@stage-recovery
      - shellprocess@bootc-install
      - fstab
      - shellprocess@cleanup-fstab
      - shellprocess@recovery-boot
      - shellprocess@finalize-bootc
      - umount
  - show:
      - finished

branding: cubelinux
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: true
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
