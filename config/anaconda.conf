[User Interface]
# Use Cubelinux installer branding rather than Fedora's default stylesheet.
custom_stylesheet = /usr/share/anaconda/pixmaps/cubelinux.css

# Account creation happens through Plasma Setup after the first boot.
hidden_spokes =
    PasswordSpoke
    UserSpoke
    RootSpoke
    NetworkSpoke
    CustomPartitioningSpoke
    BlivetGuiSpoke
